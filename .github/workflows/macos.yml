name: macOS

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_OSX_ARCHITECTURES=x86_64
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      EXPECTED_FAILURES: >-
        guest_kernel_sys guest_kernel_sys_execve
        guest_math guest_math_exact
        guest_throw_bad_array_new_length guest_libc_internal_exception_virtuals
        run_report guest_kernel_app_archive_mmap
        file_streams
        guest_sce_net guest_socket_port_zero guest_poll
        guest_ajmi_batch_inline_nid guest_ajmi_batch_run_nid guest_ajmi_batch_control_nid guest_ajmi_batch_split_nid
        guest_kernel_clock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: submodules
        name: Key the submodules on their commits
        run: |
          echo "key=$(git ls-files -s | awk '$1 == "160000" { print $2, $4 }' | cat - .gitmodules | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "ffmpeg=$(git rev-parse HEAD:3rdparty/ffmpeg-core)" >> "$GITHUB_OUTPUT"
      - id: submodule-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/submodule-gitdirs.tar
          key: submodule-gitdirs-${{ runner.os }}-${{ steps.submodules.outputs.key }}
      - name: Check out the submodules
        run: |
          if [ -f "$RUNNER_TEMP/submodule-gitdirs.tar" ]; then tar -xf "$RUNNER_TEMP/submodule-gitdirs.tar"; fi
          git submodule update --init --recursive --depth 1 --jobs 8
      - if: steps.submodule-cache.outputs.cache-hit != 'true'
        run: tar -cf "$RUNNER_TEMP/submodule-gitdirs.tar" .git/modules
      - if: steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/submodule-gitdirs.tar
          key: submodule-gitdirs-${{ runner.os }}-${{ steps.submodules.outputs.key }}
      - name: Install Rosetta 2
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job
      - id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: build/externals
          key: ffmpeg-${{ runner.os }}-${{ steps.submodules.outputs.ffmpeg }}
      - run: cmake -S . -B build $CONFIGURE
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: build/externals
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Check that every test executable is registered with ctest
        run: python3 tools/check_test_registration.py build
      - run: cmake --build build
      - run: cmake --build build --target libs
      - working-directory: build
        continue-on-error: true
        run: ctest --output-on-failure --timeout 120 --parallel 6 --output-log ctest.log --output-junit ctest.xml --no-tests=error
      - name: Fail on test failures the macOS baseline does not track
        if: ${{ !cancelled() }}
        run: python3 tools/check_expected_failures.py build/ctest.xml $EXPECTED_FAILURES
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        run: |
          [ -f build/ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\\n", name, max[name], ENVIRON["RUNNER_OS"] }' build/ctest.log
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macos-tests
          path: |
            build/ctest.log
            build/ctest.xml
          if-no-files-found: ignore
